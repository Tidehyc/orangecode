[project]
name = "orangecode"
version = "0.1.0"
description = "Concurrent, multi-turn Agent Harness with context governance, checkpoint recovery, and sandboxing"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tide" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "tiktoken>=0.7.0",
    "orjson>=3.10.0",
    "numpy>=1.26.0",
    "croniter>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
orangecode = "orangecode.cli.commands:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orangecode"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
